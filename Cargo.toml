[workspace]
members = [
    "crates/engine",
    "crates/world", 
    "crates/game",
    "crates/tools/worldgen-debug"
]
resolver = "2"

[workspace.dependencies]
# Math and utilities
glam = "0.24"
bevy_ecs = "0.12"
bytemuck = { version = "1.14", features = ["derive"] }

# Graphics and windowing
wgpu = "28"
winit = "0.30"

# Serialization and data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Performance and profiling
tracy-client = "0.16"

# Async and threading
tokio = { version = "1.0", features = ["rt-multi-thread", "fs", "io-util"] }
rayon = "1.7"

# Compression
lz4_flex = "0.11"
zstd = "0.13"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Testing
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[package]
name = "voxel-game"
version = "0.1.0"
edition = "2021"

[dependencies]
engine = { path = "crates/engine" }
world = { path = "crates/world" }
game = { path = "crates/game" }

# Application-level dependencies
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
pollster = "0.3"
winit.workspace = true
wgpu.workspace = true

[features]
default = []
profiling = ["engine/profiling"]

[[bin]]
name = "voxel-game"
path = "src/main.rs"

[[bin]]
name = "single-chunk-example"
path = "src/single_chunk_example.rs"